<!DOCTYPE html>
<html>
<head>
  <title>Nodal Officers API Test</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { color: #333; }
    .result { background: #f5f5f5; padding: 15px; border-radius: 5px; margin-top: 20px; }
    .success { border-left: 4px solid #4CAF50; }
    .error { border-left: 4px solid #f44336; }
    pre { overflow-x: auto; }
    button { padding: 10px 20px; background: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0b7dda; }
  </style>
</head>
<body>
  <h1>Nodal Officers API Test</h1>
  <button onclick="testAPI()">Test GET /api/nodal-officers</button>
  
  <div id="result"></div>

  <script>
    function testAPI() {
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '<p>Loading...</p>';
      
      fetch('http://localhost:5000/api/nodal-officers', {
        method: 'GET',
        headers: {
          'Content-Type': 'application/json'
        }
      })
      .then(response => {
        console.log('Response status:', response.status);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        return response.json();
      })
      .then(data => {
        resultDiv.innerHTML = `
          <div class="result success">
            <h2>✓ Success!</h2>
            <p>Got ${data.length} nodal officers</p>
            <pre>${JSON.stringify(data.slice(0, 2), null, 2)}...</pre>
          </div>
        `;
        console.log('Data:', data);
      })
      .catch(error => {
        resultDiv.innerHTML = `
          <div class="result error">
            <h2>✗ Error</h2>
            <p>${error.message}</p>
            <pre>${error.stack}</pre>
          </div>
        `;
        console.error('Error:', error);
      });
    }
  </script>
</body>
</html>
